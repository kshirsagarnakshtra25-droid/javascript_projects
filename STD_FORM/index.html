<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="title">
        <h1><i class="fa-solid fa-user-graduate"></i> Student Registration System</h1>
        <p>Professional Registration Portal</p>
    </div>

    <form id="studentForm">

        <div class="grid">

            <div class="input-box">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="Enter First Name" oninput="validateName(this)">
            </div>

            <div class="input-box">
                <label>Middle Name</label>
                <input type="text" id="middleName" placeholder="Enter Middle Name" oninput="validateName(this)">
            </div>

            <div class="input-box">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Enter Last Name" oninput="validateName(this)">
            </div>

            <div class="input-box">
                <label>Roll Number</label>
                <input type="text" id="roll" maxlength="5" placeholder="Enter your rollno" oninput="validateNumber(this)">
            </div>

            <div class="input-box">
                <label>Mobile Number</label>
                <input type="text"id="mobile"maxlength="10"placeholder="Enter Mobile Number"oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your Email">
            </div>

            <div class="input-box full">
                <label>Address</label>
                <textarea id="address"></textarea>
            </div>

            <div class="input-box">
                <label>Pincode</label>
                <input type="text"id="pincode"maxlength="6" placeholder="Enter pincode " oninput="validatePincode(this)">
            </div>

            <div class="input-box">
                <label>College Name</label>
                <input type="text" id="college" placeholder="Enter College Name">
            </div>

            <div class="input-box">
                <label>Course</label>

                <select id="course">

                    <option value="">Select Course</option>

                    <option>BCA</option>
                    <option>BSc</option>
                    <option>BTech</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>Java Full Stack</option>
                    <option>Python Full Stack</option>
                    <option>Data Science</option>
                    <option>Artificial Intelligence</option>

                </select>

            </div>

            <div class="input-box">

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                </div>

            </div>

            <div class="input-box full">

                <label>Skills</label>

                <div class="skills">

                    <label><input type="checkbox" value="HTML">HTML</label>

                    <label><input type="checkbox" value="CSS">CSS</label>

                    <label><input type="checkbox" value="JavaScript">JavaScript</label>

                    <label><input type="checkbox" value="React">React</label>

                    <label><input type="checkbox" value="Java">Java</label>

                    <label><input type="checkbox" value="Python">Python</label>

                </div>

            </div>

            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <div class="input-box">
                <label>Upload Photo</label>
                <input type="file" id="photo">
            </div>

        </div>

        <button class="btn" type="submit">
            <i class="fa-solid fa-paper-plane"></i>
            Register Student
        </button>

        <button class="btn" type="Reset">
            <i class="fa-solid fa-paper-plan"></i>
            Reset Informatiom
        </button>

    </form>

</div>


<div class="table-container">

    <h2>
        Registered Students
    </h2>

    <input
    type="text"
    id="search"
    placeholder="Search Student">

    <table>

        <thead>

        <tr>

            <th>Photo</th>

            <th>Name</th>

            <th>Roll</th>

            <th>Mobile</th>

            <th>Email</th>

            <th>Course</th>

            <th>Gender</th>

            <th>Skills</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

</div>
<!-- View Student Modal -->

<div id="viewModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <h2>
            <i class="fa-solid fa-user-graduate"></i>
            Student Details
        </h2>

        <div class="student-details">

            <img id="viewPhoto">

            <p><strong>Name :</strong> <span id="viewName"></span></p>

            <p><strong>Roll No :</strong> <span id="viewRoll"></span></p>

            <p><strong>Mobile :</strong> <span id="viewMobile"></span></p>

            <p><strong>Email :</strong> <span id="viewEmail"></span></p>

            <p><strong>Address :</strong> <span id="viewAddress"></span></p>

            <p><strong>Pincode :</strong> <span id="viewPincode"></span></p>

            <p><strong>College :</strong> <span id="viewCollege"></span></p>

            <p><strong>Course :</strong> <span id="viewCourse"></span></p>

            <p><strong>Gender :</strong> <span id="viewGender"></span></p>

            <p><strong>Skills :</strong> <span id="viewSkills"></span></p>

            <p><strong>DOB :</strong> <span id="viewDob"></span></p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
